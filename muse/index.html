<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muse / spatial notes</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font:13px Arial,sans-serif;color:#222;background:#fafaf9}button{font:inherit;cursor:pointer}.board{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background-color:#fafaf9;background-image:radial-gradient(#d9d9d4 .7px,transparent .8px);background-size:24px 24px}.board.pan{cursor:grabbing}.world{position:absolute;left:0;top:0;transform-origin:0 0}.wires{position:absolute;overflow:visible;left:0;top:0;pointer-events:none}.wire{fill:none;stroke:#484848;stroke-width:1.3;vector-effect:non-scaling-stroke}.preview{stroke:#888;stroke-dasharray:4 4}.node{position:absolute;min-width:85px;min-height:27px;width:200px;background:#fff;border:1px solid #444;border-radius:0;box-shadow:none;cursor:grab;touch-action:none}.node:active{cursor:grabbing}.node.selected{outline:1px solid #999;outline-offset:2px}.node textarea{display:block;border:0;outline:0;background:transparent;padding:4px 6px;min-width:100%;width:100%;resize:none;overflow:hidden;color:#111;font:14px/18px 'Courier New',monospace;min-height:25px;user-select:none;touch-action:none;pointer-events:none;cursor:grab;white-space:pre-wrap}.node.editing textarea{pointer-events:auto;cursor:text;user-select:text;touch-action:auto}.resize-handle{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;z-index:4;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 0 52%,#777 52% 59%,transparent 59% 73%,#777 73% 80%,transparent 80%)}.port{position:absolute;z-index:3;width:10px;height:6px;background:#333;border:1px solid #222;cursor:crosshair;touch-action:none}.port.in{top:-6px;left:calc(50% - 5px)}.port.out{bottom:-6px;left:calc(50% - 5px)}.node .port.out.inactive{display:none}.node.selected .port.out.inactive{display:block}.port:hover{background:#bf453c}.toolbar{position:fixed;top:15px;left:19px;right:19px;z-index:15;display:flex;gap:14px;align-items:center}.toolbar #export{margin-left:auto}.logo{font:bold 14px Arial;letter-spacing:.12em}.logo b{color:#b74739}.barbutton{border:0;background:transparent;color:#666;padding:6px}.barbutton:hover{color:#111}.help{position:fixed;bottom:16px;left:19px;font-size:11px;color:#999;pointer-events:none}.zoom{position:fixed;bottom:12px;right:14px;display:flex;align-items:center;background:#fff;border:1px solid #ddd}.zoom button{border:0;background:transparent;padding:8px 10px}.zoom span{min-width:45px;text-align:center;font-size:11px}.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 12px;display:none;font-size:12px}.wirehit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}.wire.selected{stroke:#b74739;stroke-width:2}.hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;color:#bbb}.hint strong{font:normal 21px Georgia,serif}.hint span{display:block;font-size:12px;margin-top:12px}@media(max-width:650px){.toolbar{left:12px;top:9px}.help{left:12px;max-width:220px;line-height:1.5}.node textarea{font-size:14px}}
 .login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#fafaf9;background-image:radial-gradient(#d9d9d4 .7px,transparent .8px);background-size:24px 24px}.login[hidden]{display:none}.login form{text-align:center;font:14px/1.5 "Courier New",monospace}.login input{display:block;width:220px;border:1px solid #555;background:#fff;padding:6px;font:16px "Courier New",monospace;outline:none}.login small{display:block;color:#a33;margin-top:10px;max-width:240px}.login button{position:absolute;opacity:0;pointer-events:none} .inspector{position:fixed;right:16px;top:65px;bottom:16px;overflow-y:auto;width:220px;z-index:25;background:#fafaf9;border:1px solid #aaa;padding:14px;box-shadow:0 4px 20px #0001;font:12px 'Courier New',monospace}.inspector[hidden]{display:none}.inspector header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.inspector button{border:0;background:transparent;font:inherit}.inspector label{display:block;margin-bottom:9px}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0}.swatches button{height:27px;border:1px solid #888}.swatches button.active{outline:2px solid #333;outline-offset:2px}.inspector input[type=color]{width:100%;height:30px;padding:0;border:1px solid #aaa;background:transparent}.inspector .border-preview{margin-top:12px;color:#777;font-size:11px}@media(max-width:650px){.inspector{right:8px;top:52px;width:190px}} .table-object{position:absolute;border:1px solid #777;background:#fff;touch-action:none}.table-object.selected{outline:1px solid #999;outline-offset:2px}.table-grip{height:23px;background:#f3f3f0;border-bottom:1px solid #aaa;padding:4px 8px;cursor:grab;font:12px monospace}.table-grid{display:grid}.table-cell{position:relative;border-right:1px solid #bbb;border-bottom:1px solid #bbb;min-width:0}.table-cell input{width:100%;height:100%;border:0;background:transparent;padding:4px;font:12px monospace;outline:none}.table-cell input:focus{box-shadow:inset 0 0 0 1px #666}.col-resize{position:absolute;right:-4px;top:0;width:8px;height:100%;cursor:col-resize}.row-resize{position:absolute;bottom:-4px;left:0;width:100%;height:8px;cursor:row-resize}.table-corner{position:absolute;right:-5px;bottom:-5px;width:12px;height:12px;background:#777;cursor:nwse-resize}.table-modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#0002}.table-modal[hidden]{display:none}.table-dialog{background:#fafaf9;border:1px solid #888;padding:20px;width:270px;font:12px monospace}.table-dialog label{display:flex;justify-content:space-between;margin:18px 0}.table-dialog input{width:65px;padding:5px}.table-dialog footer{display:flex;justify-content:flex-end;gap:10px}</style></head><body>
<div id="board" class="board"><div id="world" class="world"><svg id="wires" class="wires" xmlns="http://www.w3.org/2000/svg"></svg><div id="nodes"></div><div id="tables"></div></div></div>
<header class="toolbar"><span class="logo">MUSE<b>.</b></span><button id="export" class="barbutton">↓ файл</button><span id="status" style="color:#aaa;font-size:10px">сохранено</span></header>
<aside id="inspector" class="inspector" hidden><header><strong>INSPECTOR</strong><button id="closeInspector" type="button" aria-label="Закрыть Inspector">×</button></header><label for="nodeColor">Цвет окошка / Fill</label><div id="swatches" class="swatches"></div><input id="nodeColor" type="color" value="#ffffff" aria-label="Произвольный цвет"><div id="borderPreview" class="border-preview">Рамка / Auto darker</div></aside><div id="tableModal" class="table-modal" hidden><form id="tableForm" class="table-dialog"><strong>NEW TABLE</strong><label>Колонки <input id="tableCols" type="number" min="1" max="10" value="3" required></label><label>Строки <input id="tableRows" type="number" min="1" max="30" value="4" required></label><footer><button id="cancelTable" type="button">Отмена</button><button type="submit">Создать</button></footer></form></div><div id="hint" hidden></div>
<div class="help">двойной щелчок по фону → новый блок · по блоку → редактировать · перетащи → переместить · потяни нижний разъём → соединить · Backspace → удалить выделенное</div>
<div class="zoom"><button id="minus">−</button><span id="percentage">100%</span><button id="plus">+</button><button id="reset">⌖</button></div><div class="toast" id="toast"></div>
<div id="login" class="login"><form id="loginform"><label for="password">password:</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Enter</button><small id="loginerror"></small></form></div>
<script>
(()=>{
const KEY='boatbehind-muse-v2',OLD='boatbehind-muse-v1',API='/muse-api';let authenticated=false,remoteRevision=0,remoteTimer=null,syncing=false,changeCounter=0;let state={notes:[],edges:[],view:{x:innerWidth/2,y:innerHeight/2,s:1}};
try{const p=JSON.parse(localStorage.getItem(KEY));if(p?.notes&&p?.view)state=p;else{const old=JSON.parse(localStorage.getItem(OLD));if(old?.notes){state.notes=old.notes;state.view={x:old.view.x,y:old.view.y,s:old.view.scale||1};}}}catch(e){console.warn(e)}
state.edges=state.edges||[];state.tables=state.tables||[];state.view.s=state.view.s||1;const localBeforeLogin=JSON.parse(JSON.stringify(state));const $=id=>document.getElementById(id),board=$('board'),world=$('world'),nodes=$('nodes'),tables=$('tables'),svg=$('wires');
let selected=null,gesture=null,timer=null,preview=null,inspectorOpen=false;
const colors=['#ffffff','#f3e9a5','#ebc3b8','#bfd8f1','#c8dec6','#d9c9eb','#e8e8e8','#f1d4a9','#c5e2df','#303030'];
function darker(hex){const raw=hex.replace('#','');if(!/^[0-9a-f]{6}$/i.test(raw))return '#444444';return '#'+[0,2,4].map(i=>Math.round(parseInt(raw.slice(i,i+2),16)*.65).toString(16).padStart(2,'0')).join('')}
function pale(hex){return '#'+[1,3,5].map(i=>Math.round(255-(255-parseInt(hex.slice(i,i+2),16))*.12).toString(16).padStart(2,'0')).join('')}function applyColor(n,el){const fill=n.color||'#ffffff';el.style.backgroundColor=pale(fill);el.style.borderColor=n.color?fill:'#444';el.querySelector('textarea').style.color='#111'}
function updateInspector(){const panel=$('inspector'),n=selected?.type==='node'?find(selected.id):selected?.type==='table'?state.tables.find(t=>t.id===selected.id):null;panel.hidden=!inspectorOpen||!n;if(!n)return;const fill=n.color||'#ffffff';$('nodeColor').value=fill;$('borderPreview').textContent='Рамка / '+darker(fill);document.querySelectorAll('#swatches button').forEach(b=>b.classList.toggle('active',b.dataset.color===fill))}
function setNodeColor(color){const n=selected?.type==='node'?find(selected.id):selected?.type==='table'?state.tables.find(t=>t.id===selected.id):null;if(!n)return;n.color=color;if(selected.type==='node'){const el=Array.from(nodes.children).find(el=>el.dataset.id===n.id);if(el)applyColor(n,el)}else renderTables();updateInspector();save()}
for(const color of colors){const b=document.createElement('button');b.type='button';b.dataset.color=color;b.style.background=color;b.title=color;b.setAttribute('aria-label','Цвет '+color);b.onclick=()=>setNodeColor(color);$('swatches').append(b)}
$('nodeColor').addEventListener('input',e=>setNodeColor(e.target.value));$('closeInspector').onclick=()=>{inspectorOpen=false;updateInspector()};
const id=()=>crypto.randomUUID?.()||String(Date.now())+Math.random().toString(36).slice(2);
async function sendRemote(){if(!authenticated||syncing)return;syncing=true;const sentVersion=changeCounter;try{const r=await fetch(API+'/board',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({board:state,revision:remoteRevision})});if(r.status===409){$('status').textContent='конфликт: обнови страницу';return}if(!r.ok)throw Error('http '+r.status);remoteRevision=(await r.json()).revision;$('status').textContent='на сервере'}catch(e){$('status').textContent='нет связи с сервером'}finally{syncing=false;if(sentVersion!==changeCounter)remoteTimer=setTimeout(sendRemote,500)}}function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));$('status').textContent='локально сохранено'}catch(e){$('status').textContent='ошибка сохранения'}clearTimeout(remoteTimer);remoteTimer=setTimeout(sendRemote,500)}function save(){changeCounter++;clearTimeout(timer);$('status').textContent='сохраняю…';timer=setTimeout(persist,180)}
function pt(x,y){return{x:(x-state.view.x)/state.view.s,y:(y-state.view.y)/state.view.s}}
function view(){world.style.transform='translate('+state.view.x+'px,'+state.view.y+'px) scale('+state.view.s+')';$('percentage').textContent=Math.round(state.view.s*100)+'%';save()}
function find(n){return state.notes.find(a=>a.id===n)}
function point(n,kind){const el=nodes.querySelector('[data-id="'+n.id+'"]');return{x:n.x+(el?.offsetWidth||n.w||200)/2,y:n.y+(kind==='out'?(el?.offsetHeight||30):0)}}
function wirepath(a,b){const dy=Math.max(18,Math.abs(b.y-a.y)*.4);return 'M'+a.x+' '+a.y+' C'+a.x+' '+(a.y+dy)+' '+b.x+' '+(b.y-dy)+' '+b.x+' '+b.y}
function wireRender(){svg.replaceChildren();for(const edge of state.edges){const source=find(edge.from),target=find(edge.to);if(!source||!target)continue;const d=wirepath(point(source,'out'),point(target,'in'));const line=document.createElementNS('http://www.w3.org/2000/svg','path');line.setAttribute('d',d);line.setAttribute('class','wire'+(selected?.type==='wire'&&selected.id===edge.id?' selected':''));const hit=document.createElementNS('http://www.w3.org/2000/svg','path');hit.setAttribute('d',d);hit.setAttribute('class','wirehit');hit.addEventListener('pointerdown',e=>{e.stopPropagation();select({type:'wire',id:edge.id})});svg.append(line,hit)}
if(preview){const src=find(preview.from);if(src){const line=document.createElementNS('http://www.w3.org/2000/svg','path');line.setAttribute('d',wirepath(point(src,'out'),preview.at));line.setAttribute('class','wire preview');svg.append(line)}}}
function select(v){selected=v;nodes.querySelectorAll('.node').forEach(el=>el.classList.toggle('selected',v?.type==='node'&&el.dataset.id===v.id));wireRender();tables.querySelectorAll('.table-object').forEach(el=>el.classList.toggle('selected',v?.type==='table'&&el.dataset.id===v.id));updateInspector()}
function auto(t){t.style.height='auto';t.style.height=Math.max(25,t.scrollHeight)+'px';wireRender()}
function render(){nodes.replaceChildren();for(const n of state.notes){const el=document.createElement('div');el.className='node';el.dataset.id=n.id;el.style.left=n.x+'px';el.style.top=n.y+'px';el.style.width=(n.w||200)+'px';
const ta=document.createElement('textarea');ta.value=n.text||'';ta.placeholder='текст';ta.rows=1;ta.setAttribute('aria-label','Текст заметки');ta.addEventListener('input',()=>{n.text=ta.value;auto(ta);save()});ta.addEventListener('pointerdown',e=>e.stopPropagation());ta.addEventListener('focus',()=>select({type:'node',id:n.id}));ta.addEventListener('blur',()=>el.classList.remove('editing'));
el.append(ta);applyColor(n,el);const resize=document.createElement('div');resize.className='resize-handle';resize.title='Изменить ширину';resize.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.stopPropagation();e.preventDefault();ta.blur();el.classList.remove('editing');select({type:'node',id:n.id});gesture={type:'resize',id:n.id,x:e.clientX,w:el.offsetWidth};resize.setPointerCapture(e.pointerId)});resize.addEventListener('pointermove',e=>{if(gesture?.type!=='resize'||gesture.id!==n.id)return;n.w=Math.max(85,Math.min(800,gesture.w+(e.clientX-gesture.x)/state.view.s));el.style.width=n.w+'px';auto(ta);wireRender()});resize.addEventListener('pointerup',()=>{if(gesture?.type==='resize'){gesture=null;save()}});el.append(resize);
const connectedIn=state.edges.some(e=>e.to===n.id),connectedOut=state.edges.some(e=>e.from===n.id);
if(connectedIn){const p=document.createElement('div');p.className='port in';p.title='Вход';p.addEventListener('pointerdown',e=>e.stopPropagation());el.append(p)}
// An outlet is displayed only when connected, or while the node is selected, to permit making new links.
{const p=document.createElement('div');p.className='port out';if(!connectedOut)p.classList.add('inactive');p.title='Потяни к другому объекту';p.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();select({type:'node',id:n.id});gesture={type:'wire',from:n.id,pointerId:e.pointerId};preview={from:n.id,at:pt(e.clientX,e.clientY)};p.setPointerCapture(e.pointerId);wireRender()});p.addEventListener('pointermove',e=>{if(gesture?.type==='wire'&&gesture.from===n.id){preview.at=pt(e.clientX,e.clientY);wireRender()}});p.addEventListener('pointerup',e=>{if(gesture?.type!=='wire')return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.node');if(target&&target.dataset.id!==n.id&&!state.edges.some(z=>z.from===n.id&&z.to===target.dataset.id)){state.edges.push({id:id(),from:n.id,to:target.dataset.id});save()}gesture=null;preview=null;render()});el.append(p)}
el.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.classList.contains('port')||e.target===resize||el.classList.contains('editing'))return;e.stopPropagation();if(document.activeElement instanceof HTMLElement)document.activeElement.blur();select({type:'node',id:n.id});gesture={type:'node',id:n.id,x:e.clientX,y:e.clientY,nx:n.x,ny:n.y};el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{if(gesture?.type!=='node'||gesture.id!==n.id)return;n.x=gesture.nx+(e.clientX-gesture.x)/state.view.s;n.y=gesture.ny+(e.clientY-gesture.y)/state.view.s;el.style.left=n.x+'px';el.style.top=n.y+'px';wireRender()});
el.addEventListener('pointerup',()=>{if(gesture?.type==='node'){gesture=null;save()}});
el.addEventListener('dblclick',e=>{e.stopPropagation();gesture=null;el.classList.add('editing');select({type:'node',id:n.id});ta.focus();const length=ta.value.length;ta.setSelectionRange(length,length)});
nodes.append(el);requestAnimationFrame(()=>auto(ta))}
wireRender();renderTables();if(selected)select(selected);else updateInspector()}

let blankPoint=null;
function openTableModal(){blankPoint=blankPoint||{x:innerWidth/2,y:innerHeight/2};$('tableModal').hidden=false;$('tableCols').focus()}
$('cancelTable').onclick=()=>{$('tableModal').hidden=true};
$('tableForm').onsubmit=e=>{e.preventDefault();const cols=Math.max(1,Math.min(10,Number($('tableCols').value))),rows=Math.max(1,Math.min(30,Number($('tableRows').value))),p=pt(blankPoint.x,blankPoint.y),t={id:id(),x:p.x,y:p.y,cols,rows,widths:Array(cols).fill(100),heights:Array(rows).fill(30),cells:Array.from({length:rows},()=>Array(cols).fill(''))};state.tables.push(t);$('tableModal').hidden=true;renderTables();select({type:'table',id:t.id});save()};
function dragHandle(handle,move,done){handle.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();e.stopPropagation();const x=e.clientX,y=e.clientY;handle.setPointerCapture(e.pointerId);const m=ev=>move((ev.clientX-x)/state.view.s,(ev.clientY-y)/state.view.s);const u=()=>{handle.removeEventListener('pointermove',m);handle.removeEventListener('pointerup',u);done?.();save()};handle.addEventListener('pointermove',m);handle.addEventListener('pointerup',u)})}
function renderTables(){tables.replaceChildren();for(const t of state.tables){const el=document.createElement('div');el.className='table-object';el.dataset.id=t.id;el.style.left=t.x+'px';el.style.top=t.y+'px';el.style.background=pale(t.color||'#ffffff');el.style.borderColor=t.color||'#777';const grip=document.createElement('div');grip.className='table-grip';grip.textContent='TABLE '+t.rows+' × '+t.cols;const ox=t.x,oy=t.y;dragHandle(grip,(dx,dy)=>{t.x=ox+dx;t.y=oy+dy;el.style.left=t.x+'px';el.style.top=t.y+'px'},()=>{});grip.addEventListener('pointerdown',()=>select({type:'table',id:t.id}));el.append(grip);const grid=document.createElement('div');grid.className='table-grid';const update=()=>{grid.style.gridTemplateColumns=t.widths.map(w=>w+'px').join(' ');grid.style.gridTemplateRows=t.heights.map(h=>h+'px').join(' ')};update();for(let r=0;r<t.rows;r++)for(let c=0;c<t.cols;c++){const cell=document.createElement('div');cell.className='table-cell';const input=document.createElement('input');input.value=t.cells[r][c];input.onfocus=()=>select({type:'table',id:t.id});input.oninput=()=>{t.cells[r][c]=input.value;save()};cell.append(input);if(r===0){const h=document.createElement('div');h.className='col-resize';const w=t.widths[c];dragHandle(h,dx=>{t.widths[c]=Math.max(45,w+dx);update()});cell.append(h)}if(c===0){const h=document.createElement('div');h.className='row-resize';const height=t.heights[r];dragHandle(h,(_,dy)=>{t.heights[r]=Math.max(23,height+dy);update()});cell.append(h)}grid.append(cell)}el.append(grid);const corner=document.createElement('div');corner.className='table-corner';const ws=[...t.widths],hs=[...t.heights];dragHandle(corner,(dx,dy)=>{t.widths=ws.map(w=>Math.max(45,w+dx/t.cols));t.heights=hs.map(h=>Math.max(23,h+dy/t.rows));update()});el.append(corner);el.addEventListener('pointerdown',()=>select({type:'table',id:t.id}));tables.append(el)}}

function add(x,y){const p=pt(x,y),n={id:id(),x:p.x,y:p.y,w:200,text:''};state.notes.push(n);selected={type:'node',id:n.id};render();save();requestAnimationFrame(()=>{const el=nodes.querySelector('[data-id="'+n.id+'"]');el?.classList.add('editing');el?.querySelector('textarea')?.focus()})}
board.addEventListener('dblclick',e=>{if(e.target===board||e.target===world||e.target===nodes||e.target===svg)add(e.clientX,e.clientY)});
board.addEventListener('pointerdown',e=>{if(e.target!==board&&e.target!==world&&e.target!==nodes&&e.target!==svg)return;if(e.button!==0&&e.button!==1)return;select(null);blankPoint={x:e.clientX,y:e.clientY};gesture={type:'pan',x:e.clientX,y:e.clientY,vx:state.view.x,vy:state.view.y};board.classList.add('pan');board.setPointerCapture(e.pointerId)});
board.addEventListener('pointermove',e=>{if(gesture?.type!=='pan')return;state.view.x=gesture.vx+e.clientX-gesture.x;state.view.y=gesture.vy+e.clientY-gesture.y;world.style.transform='translate('+state.view.x+'px,'+state.view.y+'px) scale('+state.view.s+')'});
board.addEventListener('pointerup',()=>{if(gesture?.type==='pan'){gesture=null;board.classList.remove('pan');save()}});
function zoom(z,x=innerWidth/2,y=innerHeight/2){const p=pt(x,y);state.view.s=Math.max(.35,Math.min(3,z));state.view.x=x-p.x*state.view.s;state.view.y=y-p.y*state.view.s;view()}
board.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey||e.metaKey)zoom(state.view.s*Math.exp(-e.deltaY*.01),e.clientX,e.clientY);else{state.view.x-=e.deltaX;state.view.y-=e.deltaY;view()}},{passive:false});
window.addEventListener('keydown',e=>{if((e.key.toLowerCase()==='t'||e.key.toLowerCase()==='е')&&!selected&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&$('tableModal').hidden){e.preventDefault();openTableModal();return}if((e.key==='i'||e.key==='I'||e.key==='ш'||e.key==='Ш')&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.repeat&&(selected?.type==='node'||selected?.type==='table')&&!['TEXTAREA','INPUT'].includes(document.activeElement.tagName)&&!document.activeElement.isContentEditable){e.preventDefault();inspectorOpen=!inspectorOpen;updateInspector();return}if(e.key==='Escape'){if(!$('tableModal').hidden){$('tableModal').hidden=true;return}document.activeElement.blur();document.querySelectorAll('.node.editing').forEach(el=>el.classList.remove('editing'));select(null)}if((e.key==='Backspace'||e.key==='Delete')&&selected&&!['TEXTAREA','INPUT'].includes(document.activeElement.tagName)){e.preventDefault();if(selected.type==='table'){state.tables=state.tables.filter(t=>t.id!==selected.id)}else if(selected.type==='node'){state.notes=state.notes.filter(n=>n.id!==selected.id);state.edges=state.edges.filter(a=>a.from!==selected.id&&a.to!==selected.id)}else state.edges=state.edges.filter(a=>a.id!==selected.id);selected=null;render();save()}});
$('minus').onclick=()=>zoom(state.view.s/1.2);$('plus').onclick=()=>zoom(state.view.s*1.2);$('reset').onclick=()=>{state.view={x:innerWidth/2,y:innerHeight/2,s:1};view()};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:2,...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='muse-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
window.addEventListener('pagehide',()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}});
async function boot(){try{const r=await fetch(API+'/board',{credentials:'same-origin'});if(r.status===401){authenticated=false;$('login').hidden=true;render();view();$('status').textContent='локально сохранено';return}if(!r.ok)throw Error('API недоступен');const body=await r.json();authenticated=true;remoteRevision=body.revision;state=body.board||state;state.edges=state.edges||[];state.tables=state.tables||[];if(!state.notes.length&&localBeforeLogin.notes.length&&confirm('На этом устройстве есть старые заметки. Перенести их на сервер?')){state=localBeforeLogin} $('login').hidden=true;render();view();}catch(e){authenticated=false;$('login').hidden=true;render();view();$('status').textContent='локально сохранено';}}
$('loginform').addEventListener('submit',async e=>{e.preventDefault();$('loginerror').textContent='';try{const r=await fetch(API+'/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});if(!r.ok){$('loginerror').textContent=r.status===401?'Неверный пароль':'Нет соединения с сервером';return}$('password').value='';await boot();}catch(e){$('loginerror').textContent='Нет соединения с сервером'}});
boot();
})();
</script></body></html>
