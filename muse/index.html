<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font:13px Arial,sans-serif;color:#222;background:#fafaf9}button{font:inherit;cursor:pointer}.board{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background-color:#fafaf9;background-image:radial-gradient(#d9d9d4 .7px,transparent .8px);background-size:24px 24px}.board.pan{cursor:grabbing}.world{position:absolute;left:0;top:0;transform-origin:0 0}.wires{position:absolute;overflow:visible;left:0;top:0;pointer-events:none}.wire{fill:none;stroke:#484848;stroke-width:1.3;vector-effect:non-scaling-stroke}.preview{stroke:#888;stroke-dasharray:4 4}.node{position:absolute;min-width:85px;min-height:27px;width:200px;background:#fff;border:1px solid #444;border-radius:0;box-shadow:none;cursor:grab;touch-action:none}.node:active{cursor:grabbing}.node.selected{outline:1px solid #999;outline-offset:2px}.node textarea{display:block;border:0;outline:0;background:transparent;padding:4px 6px;min-width:100%;width:100%;resize:none;overflow:hidden;color:#111;font:14px/18px 'Courier New',monospace;min-height:25px;user-select:none;touch-action:none;pointer-events:none;cursor:grab;white-space:pre-wrap}.node.editing textarea{pointer-events:auto;cursor:text;user-select:text;touch-action:auto}.resize-handle{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;z-index:4;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 0 52%,#777 52% 59%,transparent 59% 73%,#777 73% 80%,transparent 80%)}.port{position:absolute;z-index:3;width:10px;height:6px;background:#333;border:1px solid #222;cursor:crosshair;touch-action:none}.port.in{top:-6px;left:calc(50% - 5px)}.port.out{bottom:-6px;left:calc(50% - 5px)}.node .port.out.inactive{display:none}.node.selected .port.out.inactive{display:block}.port:hover{background:#bf453c}.toolbar{position:fixed;top:15px;left:19px;right:19px;z-index:15;display:flex;gap:14px;align-items:center}.toolbar #export{margin-left:auto}.logo{font:bold 14px Arial;letter-spacing:.12em}.logo b{color:#b74739}.barbutton{border:0;background:transparent;color:#666;padding:6px}.barbutton:hover{color:#111}.mobile-tools{display:none}.help{position:fixed;bottom:16px;left:19px;font-size:11px;color:#999;pointer-events:none}.zoom{position:fixed;bottom:12px;right:14px;display:flex;align-items:center;background:#fff;border:1px solid #ddd}.zoom button{border:0;background:transparent;padding:8px 10px}.zoom span{min-width:45px;text-align:center;font-size:11px}.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 12px;display:none;font-size:12px}.wirehit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}.wire.selected{stroke:#b74739;stroke-width:2}.hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;color:#bbb}.hint strong{font:normal 21px Georgia,serif}.hint span{display:block;font-size:12px;margin-top:12px}@media(max-width:650px){.toolbar{left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(9px,env(safe-area-inset-top));gap:5px}.toolbar #addBang{display:none}.barbutton{padding:6px 4px}.mobile-tools{position:fixed;top:calc(max(9px,env(safe-area-inset-top)) + 48px);right:max(10px,env(safe-area-inset-right));z-index:24;display:flex;flex-direction:column;gap:8px}.mobile-tool{display:grid;place-items:center;width:46px;height:46px;padding:0;border:1px solid #444;background:rgba(250,250,249,.96);color:#333;box-shadow:2px 2px 0 rgba(0,0,0,.12);font:700 15px 'Courier New',monospace;touch-action:manipulation}.mobile-tool:active,.mobile-tool.active{color:#fff;background:#333;transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(0,0,0,.12)}.mobile-tool[aria-disabled=true]{color:#aaa;border-color:#aaa}.help{display:none}.node textarea{font-size:14px}.zoom{right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom))}}
 .login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#fafaf9;background-image:radial-gradient(#d9d9d4 .7px,transparent .8px);background-size:24px 24px}.login[hidden]{display:none}.login form{text-align:center;font:14px/1.5 "Courier New",monospace}.login input{display:block;width:220px;border:1px solid #555;background:#fff;padding:6px;font:16px "Courier New",monospace;outline:none}.login small{display:block;color:#a33;margin-top:10px;max-width:240px}.login button{position:absolute;opacity:0;pointer-events:none} .inspector{position:fixed;right:16px;top:65px;bottom:16px;overflow-y:auto;width:220px;z-index:25;background:#fafaf9;border:1px solid #aaa;padding:14px;box-shadow:0 4px 20px #0001;font:12px 'Courier New',monospace}.inspector[hidden]{display:none}.inspector header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.inspector button{border:0;background:transparent;font:inherit}.inspector label{display:block;margin-bottom:9px}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0}.swatches button{height:27px;border:1px solid #888}.swatches button.active{outline:2px solid #333;outline-offset:2px}.inspector input[type=color]{width:100%;height:30px;padding:0;border:1px solid #aaa;background:transparent}.inspector .border-preview{margin-top:12px;color:#777;font-size:11px}@media(max-width:650px){.inspector{right:8px;top:52px;width:190px}} .table-object{position:absolute;border:1px solid #777;background:#fff;touch-action:none}.table-object.selected{outline:1px solid #999;outline-offset:2px}.table-grip{height:23px;background:#f3f3f0;border-bottom:1px solid #aaa;padding:4px 8px;cursor:grab;font:12px monospace}.table-grid{display:grid}.table-cell{position:relative;border-right:1px solid #bbb;border-bottom:1px solid #bbb;min-width:0}.table-cell input{width:100%;height:100%;border:0;background:transparent;padding:4px;font:12px monospace;outline:none}.table-cell input:focus{box-shadow:inset 0 0 0 1px #666}.col-resize{position:absolute;right:-4px;top:0;width:8px;height:100%;cursor:col-resize}.row-resize{position:absolute;bottom:-4px;left:0;width:100%;height:8px;cursor:row-resize}.table-corner{position:absolute;right:-5px;bottom:-5px;width:12px;height:12px;background:#777;cursor:nwse-resize}.table-modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#0002}.table-modal[hidden]{display:none}.table-dialog{background:#fafaf9;border:1px solid #888;padding:20px;width:270px;font:12px monospace}.table-dialog label{display:flex;justify-content:space-between;margin:18px 0}.table-dialog input{width:65px;padding:5px}.table-dialog footer{display:flex;justify-content:flex-end;gap:10px}</style></head><body>
<div id="board" class="board"><div id="world" class="world"><svg id="wires" class="wires" xmlns="http://www.w3.org/2000/svg"></svg><div id="nodes"></div><div id="tables"></div><div id="bangs"></div></div></div>
<header class="toolbar"><span class="logo">MUSE<b>.</b></span><button id="addBang" class="barbutton" title="Добавить Bang (B)">○ bang</button><button id="export" class="barbutton">↓ файл</button><span id="status" style="color:#aaa;font-size:10px">сохранено</span></header>

<style>
.port{z-index:8;width:10px;height:7px;transform:translateX(-50%)}.port.in{top:-7px;left:auto}.port.out{bottom:-7px;left:auto}.connectable .port.in.inactive,.connectable .port.out.inactive{display:none}.connectable.selected .port{display:block}.world.wiring .port.in{display:block}.port:hover,.port.target{background:#bf453c;transform:translateX(-50%) scale(1.3)}
.io-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px;border-bottom:1px solid #ccc;padding-bottom:14px}.io-controls label{margin:0}.io-controls input{display:block;width:100%;margin-top:6px;padding:5px;border:1px solid #aaa;background:#fff;font:inherit}
.bang-object{position:absolute;width:62px;height:32px;border:1px solid #333;background:#f6f6f3;display:grid;place-items:center;cursor:grab;touch-action:none}.bang-object::before{content:'';width:15px;height:15px;border:1px solid #333;border-radius:50%;background:#fff}.bang-object.selected{outline:1px solid #999;outline-offset:2px}
</style>
<script>
(()=>{
const KEY='boatbehind-muse-v2',OLD='boatbehind-muse-v1',API='/muse-api';let authenticated=false,remoteRevision=0,remoteTimer=null,syncing=false,changeCounter=0;let state={notes:[],edges:[],view:{x:innerWidth/2,y:innerHeight/2,s:1}};
try{const p=JSON.parse(localStorage.getItem(KEY));if(p?.notes&&p?.view)state=p;else{const old=JSON.parse(localStorage.getItem(OLD));if(old?.notes){state.notes=old.notes;state.view={x:old.view.x,y:old.view.y,s:old.view.scale||1};}}}catch(e){console.warn(e)}
state.edges=state.edges||[];state.tables=state.tables||[];state.bangs=state.bangs||[];state.view.s=state.view.s||1;
for(const n of [...state.notes,...state.tables,...state.bangs]){n.inputs=Math.max(1,n.inputs||1);n.outputs=Math.max(1,n.outputs||1)}
for(const e of state.edges){e.fromPort=Number.isInteger(e.fromPort)?e.fromPort:0;e.toPort=Number.isInteger(e.toPort)?e.toPort:0}
const localBeforeLogin=JSON.parse(JSON.stringify(state));const $=id=>document.getElementById(id),board=$('board'),world=$('world'),nodes=$('nodes'),tables=$('tables'),bangs=$('bangs'),svg=$('wires');
let selected=null,gesture=null,timer=null,preview=null,inspectorOpen=false,idleTimer=null;
const IDLE_MS=5*60*1000;
const colors=['#ffffff','#f3e9a5','#ebc3b8','#bfd8f1','#c8dec6','#d9c9eb','#e8e8e8','#f1d4a9','#c5e2df','#303030'];
function darker(hex){const raw=hex.replace('#','');if(!/^[0-9a-f]{6}$/i.test(raw))return '#444444';return '#'+[0,2,4].map(i=>Math.round(parseInt(raw.slice(i,i+2),16)*.65).toString(16).padStart(2,'0')).join('')}
function pale(hex){return '#'+[1,3,5].map(i=>Math.round(255-(255-parseInt(hex.slice(i,i+2),16))*.19).toString(16).padStart(2,'0')).join('')}function applyColor(n,el){const fill=n.color||'#ffffff';el.style.backgroundColor=pale(fill);el.style.borderColor='#333';el.querySelector('textarea').style.color='#111'}
function objectByRef(ref){if(!ref)return null;if(ref.type==='node')return find(ref.id);if(ref.type==='table')return state.tables.find(t=>t.id===ref.id);if(ref.type==='bang')return state.bangs.find(b=>b.id===ref.id);return null}
function objectById(objectId){return state.notes.find(n=>n.id===objectId)||state.tables.find(t=>t.id===objectId)||state.bangs.find(b=>b.id===objectId)||null}
function updateInspector(){const panel=$('inspector'),n=objectByRef(selected),mobileButton=$('mobileInspector');panel.hidden=!inspectorOpen||!n;mobileButton.classList.toggle('active',inspectorOpen&&!!n);mobileButton.setAttribute('aria-disabled',n?'false':'true');if(!n)return;const fill=n.color||'#ffffff';$('nodeColor').value=fill;$('inputCount').value=n.inputs||1;$('outputCount').value=n.outputs||1;$('borderPreview').textContent='Рамка / '+darker(fill);document.querySelectorAll('#swatches button').forEach(b=>b.classList.toggle('active',b.dataset.color===fill))}
function setNodeColor(color){const n=objectByRef(selected);if(!n)return;n.color=color;render();updateInspector();save()}
function setPortCount(kind,value){const n=objectByRef(selected);if(!n)return;const count=Math.max(1,Math.min(16,Number(value)||1));n[kind]=count;state.edges=state.edges.filter(e=>kind==='inputs'?(e.to!==n.id||(e.toPort||0)<count):(e.from!==n.id||(e.fromPort||0)<count));render();updateInspector();save()}
for(const color of colors){const b=document.createElement('button');b.type='button';b.dataset.color=color;b.style.background=color;b.title=color;b.setAttribute('aria-label','Цвет '+color);b.onclick=()=>setNodeColor(color);$('swatches').append(b)}
$('nodeColor').addEventListener('input',e=>setNodeColor(e.target.value));$('inputCount').addEventListener('change',e=>setPortCount('inputs',e.target.value));$('outputCount').addEventListener('change',e=>setPortCount('outputs',e.target.value));$('closeInspector').onclick=()=>{inspectorOpen=false;updateInspector()};
const id=()=>crypto.randomUUID?.()||String(Date.now())+Math.random().toString(36).slice(2);
let toastTimer;function showToast(message){const toast=$('toast');toast.textContent=message;toast.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.style.display='none',1600)}
function resetIdleTimer(){clearTimeout(idleTimer);if(authenticated)idleTimer=setTimeout(logoutForInactivity,IDLE_MS)}
async function logoutForInactivity(){clearTimeout(idleTimer);authenticated=false;clearTimeout(remoteTimer);try{await fetch(API+'/logout',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:'{}'})}catch(e){}$('login').hidden=false;$('loginerror').textContent='Сессия завершена после 5 минут бездействия';$('status').textContent='нужен вход';$('password').focus()}
for(const eventName of ['pointerdown','keydown','wheel'])window.addEventListener(eventName,resetIdleTimer,{capture:true,passive:true});
async function sendRemote(){if(!authenticated||syncing)return;syncing=true;const sentVersion=changeCounter;try{const r=await fetch(API+'/board',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({board:state,revision:remoteRevision})});if(r.status===401){authenticated=false;$('login').hidden=false;$('status').textContent='нужен вход';return}if(r.status===409){const conflict=await r.json();remoteRevision=conflict.revision;changeCounter++;$('status').textContent='повторная синхронизация…';return}if(!r.ok)throw Error('http '+r.status);remoteRevision=(await r.json()).revision;$('status').textContent='сохранено в БД'}catch(e){$('status').textContent='нет связи — сохранено локально'}finally{syncing=false;if(authenticated&&sentVersion!==changeCounter)remoteTimer=setTimeout(sendRemote,500)}}function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));$('status').textContent=authenticated?'сохраняю в БД…':'сохранено локально'}catch(e){$('status').textContent='ошибка сохранения'}clearTimeout(remoteTimer);if(authenticated)remoteTimer=setTimeout(sendRemote,350)}function save(){changeCounter++;clearTimeout(timer);$('status').textContent=authenticated?'сохраняю в БД…':'сохраняю локально…';timer=setTimeout(persist,180)}
function pt(x,y){return{x:(x-state.view.x)/state.view.s,y:(y-state.view.y)/state.view.s}}
function view(){world.style.transform='translate('+state.view.x+'px,'+state.view.y+'px) scale('+state.view.s+')';$('percentage').textContent=Math.round(state.view.s*100)+'%';save()}
function find(n){return state.notes.find(a=>a.id===n)}
function objectElement(objectId){return world.querySelector('[data-id="'+objectId+'"]')}
function point(n,kind,index=0){const el=objectElement(n.id),count=Math.max(1,n[kind==='out'?'outputs':'inputs']||1),width=el?.offsetWidth||n.w||62;return{x:n.x+width*((index+1)/(count+1)),y:n.y+(kind==='out'?(el?.offsetHeight||32):0)}}
function wirepath(a,b){const dy=Math.max(18,Math.abs(b.y-a.y)*.4);return 'M'+a.x+' '+a.y+' C'+a.x+' '+(a.y+dy)+' '+b.x+' '+(b.y-dy)+' '+b.x+' '+b.y}
function wireRender(){svg.replaceChildren();for(const edge of state.edges){const source=objectById(edge.from),target=objectById(edge.to);if(!source||!target)continue;const d=wirepath(point(source,'out',edge.fromPort||0),point(target,'in',edge.toPort||0));const line=document.createElementNS('http://www.w3.org/2000/svg','path');line.setAttribute('d',d);line.setAttribute('class','wire'+(selected?.type==='wire'&&selected.id===edge.id?' selected':''));const hit=document.createElementNS('http://www.w3.org/2000/svg','path');hit.setAttribute('d',d);hit.setAttribute('class','wirehit');hit.addEventListener('pointerdown',e=>{e.stopPropagation();select({type:'wire',id:edge.id})});svg.append(line,hit)}
if(preview){const src=objectById(preview.from);if(src){const line=document.createElementNS('http://www.w3.org/2000/svg','path');line.setAttribute('d',wirepath(point(src,'out',preview.fromPort),preview.at));line.setAttribute('class','wire preview');svg.append(line)}}}
function select(v){selected=v;nodes.querySelectorAll('.node').forEach(el=>el.classList.toggle('selected',v?.type==='node'&&el.dataset.id===v.id));tables.querySelectorAll('.table-object').forEach(el=>el.classList.toggle('selected',v?.type==='table'&&el.dataset.id===v.id));bangs.querySelectorAll('.bang-object').forEach(el=>el.classList.toggle('selected',v?.type==='bang'&&el.dataset.id===v.id));wireRender();updateInspector()}
function appendPorts(el,obj,type){el.classList.add('connectable');for(let i=0;i<obj.inputs;i++){const p=document.createElement('div'),connected=state.edges.some(e=>e.to===obj.id&&(e.toPort||0)===i);p.className='port in'+(connected?'':' inactive');p.dataset.objectId=obj.id;p.dataset.port=String(i);p.title='Input '+(i+1);p.style.left=((i+1)/(obj.inputs+1)*100)+'%';p.addEventListener('pointerdown',e=>e.stopPropagation());el.append(p)}for(let i=0;i<obj.outputs;i++){const p=document.createElement('div'),connected=state.edges.some(e=>e.from===obj.id&&(e.fromPort||0)===i);p.className='port out'+(connected?'':' inactive');p.dataset.objectId=obj.id;p.dataset.port=String(i);p.title='Output '+(i+1)+' — потяни к input';p.style.left=((i+1)/(obj.outputs+1)*100)+'%';p.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.stopPropagation();e.preventDefault();select({type,id:obj.id});gesture={type:'wire',from:obj.id,fromPort:i,pointerId:e.pointerId};preview={from:obj.id,fromPort:i,at:pt(e.clientX,e.clientY)};world.classList.add('wiring');p.setPointerCapture(e.pointerId);wireRender()});p.addEventListener('pointermove',e=>{if(gesture?.type==='wire'&&gesture.from===obj.id&&gesture.fromPort===i){preview.at=pt(e.clientX,e.clientY);document.querySelectorAll('.port.target').forEach(x=>x.classList.remove('target'));document.elementFromPoint(e.clientX,e.clientY)?.closest('.port.in')?.classList.add('target');wireRender()}});p.addEventListener('pointerup',e=>{if(gesture?.type!=='wire')return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.port.in');if(target){const to=target.dataset.objectId,toPort=Number(target.dataset.port);if(to!==obj.id&&!state.edges.some(z=>z.from===obj.id&&z.fromPort===i&&z.to===to&&z.toPort===toPort)){state.edges.push({id:id(),from:obj.id,fromPort:i,to,toPort});save()}}gesture=null;preview=null;world.classList.remove('wiring');render()});el.append(p)}}
function auto(t){t.style.height='auto';t.style.height=Math.max(25,t.scrollHeight)+'px';wireRender()}
let lastTouchTap=null,touchTapStart=null;
function editNode(el,n,ta){gesture=null;el.classList.add('editing');select({type:'node',id:n.id});ta.focus();const length=ta.value.length;ta.setSelectionRange(length,length)}
function render(){nodes.replaceChildren();for(const n of state.notes){const el=document.createElement('div');el.className='node';el.dataset.id=n.id;el.style.left=n.x+'px';el.style.top=n.y+'px';el.style.width=(n.w||200)+'px';
const ta=document.createElement('textarea');ta.value=n.text||'';ta.placeholder='текст';ta.rows=1;ta.setAttribute('aria-label','Текст заметки');ta.addEventListener('input',()=>{n.text=ta.value;auto(ta);save()});ta.addEventListener('pointerdown',e=>e.stopPropagation());ta.addEventListener('focus',()=>select({type:'node',id:n.id}));ta.addEventListener('blur',()=>el.classList.remove('editing'));
el.append(ta);applyColor(n,el);const resize=document.createElement('div');resize.className='resize-handle';resize.title='Изменить ширину';resize.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.stopPropagation();e.preventDefault();ta.blur();el.classList.remove('editing');select({type:'node',id:n.id});gesture={type:'resize',id:n.id,x:e.clientX,w:el.offsetWidth};resize.setPointerCapture(e.pointerId)});resize.addEventListener('pointermove',e=>{if(gesture?.type!=='resize'||gesture.id!==n.id)return;n.w=Math.max(85,Math.min(800,gesture.w+(e.clientX-gesture.x)/state.view.s));el.style.width=n.w+'px';auto(ta);wireRender()});resize.addEventListener('pointerup',()=>{if(gesture?.type==='resize'){gesture=null;save()}});el.append(resize);
appendPorts(el,n,'node');
el.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.classList.contains('port')||e.target===resize||el.classList.contains('editing'))return;e.stopPropagation();if(document.activeElement instanceof HTMLElement)document.activeElement.blur();select({type:'node',id:n.id});gesture={type:'node',id:n.id,x:e.clientX,y:e.clientY,nx:n.x,ny:n.y};if(e.pointerType==='touch')touchTapStart={id:n.id,x:e.clientX,y:e.clientY,time:Date.now()};el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{if(gesture?.type!=='node'||gesture.id!==n.id)return;n.x=gesture.nx+(e.clientX-gesture.x)/state.view.s;n.y=gesture.ny+(e.clientY-gesture.y)/state.view.s;el.style.left=n.x+'px';el.style.top=n.y+'px';wireRender()});
el.addEventListener('pointerup',e=>{if(gesture?.type==='node'){gesture=null;save()}if(e.pointerType==='touch'&&touchTapStart?.id===n.id&&Date.now()-touchTapStart.time<450&&Math.hypot(e.clientX-touchTapStart.x,e.clientY-touchTapStart.y)<12){const now=Date.now();if(lastTouchTap?.id===n.id&&now-lastTouchTap.time<380){lastTouchTap=null;editNode(el,n,ta)}else lastTouchTap={id:n.id,time:now}}touchTapStart=null});
el.addEventListener('dblclick',e=>{e.stopPropagation();editNode(el,n,ta)});
nodes.append(el);requestAnimationFrame(()=>auto(ta))}
renderTables();renderBangs();wireRender();if(selected)select(selected);else updateInspector()}

let blankPoint=null;
function openTableModal(){blankPoint=blankPoint||{x:innerWidth/2,y:innerHeight/2};$('tableModal').hidden=false;$('tableCols').focus()}
$('cancelTable').onclick=()=>{$('tableModal').hidden=true};
$('tableForm').onsubmit=e=>{e.preventDefault();const cols=Math.max(1,Math.min(10,Number($('tableCols').value))),rows=Math.max(1,Math.min(30,Number($('tableRows').value))),p=pt(blankPoint.x,blankPoint.y),t={id:id(),x:p.x,y:p.y,cols,rows,inputs:1,outputs:1,widths:Array(cols).fill(100),heights:Array(rows).fill(30),cells:Array.from({length:rows},()=>Array(cols).fill(''))};state.tables.push(t);$('tableModal').hidden=true;render();select({type:'table',id:t.id});save()};
function dragHandle(handle,move,done){handle.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();e.stopPropagation();const x=e.clientX,y=e.clientY;handle.setPointerCapture(e.pointerId);const m=ev=>move((ev.clientX-x)/state.view.s,(ev.clientY-y)/state.view.s);const u=()=>{handle.removeEventListener('pointermove',m);handle.removeEventListener('pointerup',u);done?.();save()};handle.addEventListener('pointermove',m);handle.addEventListener('pointerup',u)})}
function renderTables(){tables.replaceChildren();for(const t of state.tables){const el=document.createElement('div');el.className='table-object';el.dataset.id=t.id;el.style.left=t.x+'px';el.style.top=t.y+'px';el.style.background=pale(t.color||'#ffffff');el.style.borderColor='#333';const grip=document.createElement('div');grip.className='table-grip';grip.textContent='TABLE '+t.rows+' × '+t.cols;const ox=t.x,oy=t.y;dragHandle(grip,(dx,dy)=>{t.x=ox+dx;t.y=oy+dy;el.style.left=t.x+'px';el.style.top=t.y+'px';wireRender()},()=>{});grip.addEventListener('pointerdown',()=>select({type:'table',id:t.id}));el.append(grip);const grid=document.createElement('div');grid.className='table-grid';const update=()=>{grid.style.gridTemplateColumns=t.widths.map(w=>w+'px').join(' ');grid.style.gridTemplateRows=t.heights.map(h=>h+'px').join(' ');wireRender()};update();for(let r=0;r<t.rows;r++)for(let c=0;c<t.cols;c++){const cell=document.createElement('div');cell.className='table-cell';const input=document.createElement('input');input.value=t.cells[r][c];input.onfocus=()=>select({type:'table',id:t.id});input.oninput=()=>{t.cells[r][c]=input.value;save()};cell.append(input);if(r===0){const h=document.createElement('div');h.className='col-resize';const w=t.widths[c];dragHandle(h,dx=>{t.widths[c]=Math.max(45,w+dx);update()});cell.append(h)}if(c===0){const h=document.createElement('div');h.className='row-resize';const height=t.heights[r];dragHandle(h,(_,dy)=>{t.heights[r]=Math.max(23,height+dy);update()});cell.append(h)}grid.append(cell)}el.append(grid);const corner=document.createElement('div');corner.className='table-corner';const ws=[...t.widths],hs=[...t.heights];dragHandle(corner,(dx,dy)=>{t.widths=ws.map(w=>Math.max(45,w+dx/t.cols));t.heights=hs.map(h=>Math.max(23,h+dy/t.rows));update()});el.append(corner);appendPorts(el,t,'table');el.addEventListener('pointerdown',()=>select({type:'table',id:t.id}));tables.append(el)}}

function renderBangs(){bangs.replaceChildren();for(const b of state.bangs){const el=document.createElement('div');el.className='bang-object';el.dataset.id=b.id;el.style.left=b.x+'px';el.style.top=b.y+'px';el.style.background=pale(b.color||'#ffffff');appendPorts(el,b,'bang');el.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.classList.contains('port'))return;e.stopPropagation();select({type:'bang',id:b.id});gesture={type:'bang',id:b.id,x:e.clientX,y:e.clientY,nx:b.x,ny:b.y};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(gesture?.type!=='bang'||gesture.id!==b.id)return;b.x=gesture.nx+(e.clientX-gesture.x)/state.view.s;b.y=gesture.ny+(e.clientY-gesture.y)/state.view.s;el.style.left=b.x+'px';el.style.top=b.y+'px';wireRender()});el.addEventListener('pointerup',()=>{if(gesture?.type==='bang'){gesture=null;save()}});bangs.append(el)}}

function add(x,y){const p=pt(x,y),n={id:id(),x:p.x,y:p.y,w:200,text:'',inputs:1,outputs:1};state.notes.push(n);selected={type:'node',id:n.id};render();save();requestAnimationFrame(()=>{const el=nodes.querySelector('[data-id="'+n.id+'"]');el?.classList.add('editing');el?.querySelector('textarea')?.focus()})}
function addBang(x=innerWidth/2,y=innerHeight/2){const p=pt(x,y),b={id:id(),x:p.x-31,y:p.y-16,inputs:1,outputs:1};state.bangs.push(b);render();select({type:'bang',id:b.id});save()}
$('addBang').onclick=()=>addBang();
$('mobileInspector').onclick=()=>{if(!objectByRef(selected)){showToast('Сначала выберите объект');return}inspectorOpen=!inspectorOpen;updateInspector()};
$('mobileBang').onclick=()=>addBang(blankPoint?.x,blankPoint?.y);
$('mobileTable').onclick=()=>openTableModal();
board.addEventListener('dblclick',e=>{if(e.target===board||e.target===world||e.target===nodes||e.target===svg)add(e.clientX,e.clientY)});
board.addEventListener('pointerdown',e=>{if(e.target!==board&&e.target!==world&&e.target!==nodes&&e.target!==svg)return;if(e.button!==0&&e.button!==1)return;select(null);blankPoint={x:e.clientX,y:e.clientY};gesture={type:'pan',x:e.clientX,y:e.clientY,vx:state.view.x,vy:state.view.y};board.classList.add('pan');board.setPointerCapture(e.pointerId)});
board.addEventListener('pointermove',e=>{if(gesture?.type!=='pan')return;state.view.x=gesture.vx+e.clientX-gesture.x;state.view.y=gesture.vy+e.clientY-gesture.y;world.style.transform='translate('+state.view.x+'px,'+state.view.y+'px) scale('+state.view.s+')'});
board.addEventListener('pointerup',()=>{if(gesture?.type==='pan'){gesture=null;board.classList.remove('pan');save()}});
const touchPoints=new Map();let pinch=null;
board.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;touchPoints.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touchPoints.size===2){const [a,b]=[...touchPoints.values()],cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,distance=Math.hypot(a.x-b.x,a.y-b.y);pinch={distance:Math.max(1,distance),scale:state.view.s,world:pt(cx,cy)};gesture=null;board.classList.remove('pan');e.preventDefault();e.stopPropagation()}},{capture:true});
board.addEventListener('pointermove',e=>{if(e.pointerType!=='touch'||!touchPoints.has(e.pointerId))return;touchPoints.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!pinch||touchPoints.size<2)return;const [a,b]=[...touchPoints.values()],cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,distance=Math.hypot(a.x-b.x,a.y-b.y),scale=Math.max(.35,Math.min(3,pinch.scale*distance/pinch.distance));state.view.s=scale;state.view.x=cx-pinch.world.x*scale;state.view.y=cy-pinch.world.y*scale;world.style.transform='translate('+state.view.x+'px,'+state.view.y+'px) scale('+state.view.s+')';$('percentage').textContent=Math.round(state.view.s*100)+'%';e.preventDefault();e.stopPropagation()},{capture:true});
function finishTouch(e){if(e.pointerType!=='touch')return;touchPoints.delete(e.pointerId);if(pinch){pinch=null;gesture=null;save();e.preventDefault();e.stopPropagation()}}
board.addEventListener('pointerup',finishTouch,{capture:true});board.addEventListener('pointercancel',finishTouch,{capture:true});
function zoom(z,x=innerWidth/2,y=innerHeight/2){const p=pt(x,y);state.view.s=Math.max(.35,Math.min(3,z));state.view.x=x-p.x*state.view.s;state.view.y=y-p.y*state.view.s;view()}
board.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey||e.metaKey)zoom(state.view.s*Math.exp(-e.deltaY*.01),e.clientX,e.clientY);else{state.view.x-=e.deltaX;state.view.y-=e.deltaY;view()}},{passive:false});
window.addEventListener('keydown',e=>{const typing=['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable;if((e.key.toLowerCase()==='t'||e.key.toLowerCase()==='е')&&!selected&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!typing&&$('tableModal').hidden){e.preventDefault();openTableModal();return}if((e.key.toLowerCase()==='b'||e.key.toLowerCase()==='и')&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!typing&&$('tableModal').hidden){e.preventDefault();addBang(blankPoint?.x,blankPoint?.y);return}if((e.key==='i'||e.key==='I'||e.key==='ш'||e.key==='Ш')&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.repeat&&objectByRef(selected)&&!typing){e.preventDefault();inspectorOpen=!inspectorOpen;updateInspector();return}if(e.key==='Escape'){if(!$('tableModal').hidden){$('tableModal').hidden=true;return}document.activeElement.blur();document.querySelectorAll('.node.editing').forEach(el=>el.classList.remove('editing'));select(null)}if((e.key==='Backspace'||e.key==='Delete')&&selected&&!typing){e.preventDefault();if(selected.type==='table')state.tables=state.tables.filter(t=>t.id!==selected.id);else if(selected.type==='node')state.notes=state.notes.filter(n=>n.id!==selected.id);else if(selected.type==='bang')state.bangs=state.bangs.filter(b=>b.id!==selected.id);else{state.edges=state.edges.filter(a=>a.id!==selected.id);selected=null;render();save();return}state.edges=state.edges.filter(a=>a.from!==selected.id&&a.to!==selected.id);selected=null;render();save()}});
$('minus').onclick=()=>zoom(state.view.s/1.2);$('plus').onclick=()=>zoom(state.view.s*1.2);$('reset').onclick=()=>{state.view={x:innerWidth/2,y:innerHeight/2,s:1};view()};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:2,...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='muse-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
window.addEventListener('pagehide',()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}});
async function boot(){try{const r=await fetch(API+'/board',{credentials:'same-origin'});if(r.status===401){authenticated=false;clearTimeout(idleTimer);$('login').hidden=false;$('status').textContent='введите пароль';$('password').focus();return}if(!r.ok)throw Error('API недоступен');const body=await r.json();authenticated=true;resetIdleTimer();remoteRevision=body.revision;state=body.board||state;state.notes=state.notes||[];state.edges=state.edges||[];state.tables=state.tables||[];state.bangs=state.bangs||[];for(const n of [...state.notes,...state.tables,...state.bangs]){n.inputs=Math.max(1,n.inputs||1);n.outputs=Math.max(1,n.outputs||1)}for(const edge of state.edges){edge.fromPort=Number.isInteger(edge.fromPort)?edge.fromPort:0;edge.toPort=Number.isInteger(edge.toPort)?edge.toPort:0}if(!state.notes.length&&localBeforeLogin.notes.length&&confirm('На этом устройстве есть старые заметки. Перенести их в базу данных?')){state=localBeforeLogin;changeCounter++;} $('login').hidden=true;render();view();$('status').textContent='сохранено в БД';if(changeCounter)remoteTimer=setTimeout(sendRemote,100);}catch(e){authenticated=false;clearTimeout(idleTimer);$('login').hidden=false;$('status').textContent='БД недоступна';$('loginerror').textContent='Нет соединения с сервером';}}
$('loginform').addEventListener('submit',async e=>{e.preventDefault();$('loginerror').textContent='';try{const r=await fetch(API+'/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});if(!r.ok){$('loginerror').textContent=r.status===401?'Неверный пароль':'Нет соединения с сервером';return}$('password').value='';await boot();}catch(e){$('loginerror').textContent='Нет соединения с сервером'}});
boot();
})();
