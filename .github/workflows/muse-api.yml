name: Install Muse API

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/muse-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Download Muse source
        uses: actions/checkout@v4
        with:
          repository: dschkn/muse
          ref: main
          path: muse-src
          persist-credentials: false

      - name: Check secret configuration
        env:
          MUSE_PASSWORD: ${{ secrets.MUSE_PASSWORD }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo 'DEPLOY_SSH_KEY missing'; exit 1; }
          test -n "$MUSE_PASSWORD" || { echo 'ACTION REQUIRED: Set MUSE_PASSWORD as a repository secret in dschkn/boatbehind'; exit 1; }

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 168.222.203.229 >> ~/.ssh/known_hosts

      - name: Upload backend files
        run: |
          ssh dschkn@168.222.203.229 'mkdir -p ~/muse-api ~/.config/muse && chmod 700 ~/.config/muse'
          rsync -az muse-src/server/app.py dschkn@168.222.203.229:~/muse-api/app.py

      - name: Set private password without putting it in git
        env:
          MUSE_PASSWORD: ${{ secrets.MUSE_PASSWORD }}
        run: |
          printf '%s' "$MUSE_PASSWORD" | ssh dschkn@168.222.203.229 'umask 077; cat > ~/.config/muse/password'

      - name: Restart Muse API as deploy user
        run: |
          ssh dschkn@168.222.203.229 <<'REMOTE'
          pkill -f '/muse-api/[a]pp.py' || true
          sleep 1
          nohup env \
            MUSE_HOST=127.0.0.1 \
            MUSE_PORT=8765 \
            MUSE_DB="$HOME/.local/share/muse/board.sqlite3" \
            MUSE_PASSWORD_FILE="$HOME/.config/muse/password" \
            MUSE_SESSION_SECRET_FILE="$HOME/.config/muse/session-secret" \
            /usr/bin/python3 "$HOME/muse-api/app.py" >> "$HOME/muse-api/runtime.log" 2>&1 &
          sleep 3
          prefixed="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/muse-api/board || true)"
          stripped="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/board || true)"
          echo "Local API: prefixed=$prefixed stripped=$stripped"
          test "$prefixed" = '401' && test "$stripped" = '401'
          REMOTE

      - name: Ensure Muse reverse proxy route
        run: |
          ssh dschkn@168.222.203.229 'python3 -' <<'PY'
          import json
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          base='http://127.0.0.1:2019'
          with urlopen(base+'/config/apps/http/servers',timeout=5) as response:
              servers=json.load(response)
          for name,server in servers.items():
              print('Caddy server',name,'listens on',server.get('listen',[]))
          target=next((name for name,server in servers.items() if any(':443' in address for address in server.get('listen',[])) and 'boatbehind.online' in json.dumps(server)),None)
          if not target:
              raise SystemExit('boatbehind.online server not found in Caddy runtime config')
          if 'muse-api' not in json.dumps(servers[target]):
              route={
                  'match':[{'host':['boatbehind.online'],'path':['/muse-api/*']}],
                  'handle':[{'handler':'reverse_proxy','upstreams':[{'dial':'127.0.0.1:8765'}]}],
                  'terminal':True,
              }
              url=base+'/config/apps/http/servers/'+quote(target,safe='')+'/routes/0'
              request=Request(url,data=json.dumps(route).encode(),method='POST',headers={'Content-Type':'application/json'})
              with urlopen(request,timeout=5) as response:
                  response.read()
              print('Muse reverse proxy route added to HTTPS server',target)
          else:
              print('Muse reverse proxy route already present in HTTPS server',target)
          PY

      - name: Verify authentication endpoint
        run: |
          result="$(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' https://boatbehind.online/muse-api/board)"
          test "$result" = '401' || { echo "Expected 401 from unauthenticated API; got $result"; exit 1; }

      - name: Publish authenticated Muse interface
        run: |
          rsync -az muse-src/index.html dschkn@168.222.203.229:/var/www/boatbehind/muse/index.html
          echo "Muse server-backed workspace deployed"
